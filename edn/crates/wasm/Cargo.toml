[package]
name = "workspace-edn-wasm"
version = "0.1.0"
description = "WebAssembly binding of workspace-edn, for the web and Node (Linux's app)"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
workspace-edn = { path = "../core" }
# Must match the wasm-bindgen CLI that builds it exactly.
wasm-bindgen = "=0.2.121"
