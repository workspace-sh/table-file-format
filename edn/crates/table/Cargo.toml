[package]
name = "workspace-table"
version = "0.1.0"
description = "The .table engine: the format's logic, shared by every app through the ffi, wasm and node bindings (table-file-format#867)"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
workspace-edn = { path = "../core" }
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "raw_value"] }
# Rows files as a zip holds them (deflate), inflated by the engine.
miniz_oxide = "0.8"
# The CRC-32 a zip entry declares, checked a word at a time (SIMD where the chip has it).
crc32fast = "1"
# A number as JavaScript writes it (Number.prototype.toString), for a group named by a number.
ryu-js = "1"
