// The core in the Android apps (WorkspaceEdnModule): the Rust core's C
// binding, prebuilt per ABI by ../build-android.sh, put on the JavaScript
// runtime for @workspace.sh/edn/jsi. Prebuilt so an app build needs no Rust,
// as the Apple side takes the framework build-apple.sh makes.
buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("com.android.tools.build:gradle:8.7.2")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21")
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
  namespace "sh.workspace.edn"
  compileSdk 35

  // find_package(ReactAndroid) in CMakeLists.txt resolves through prefab.
  buildFeatures {
    prefab true
  }

  defaultConfig {
    minSdk 24
    consumerProguardFiles "consumer-rules.pro"
    externalNativeBuild {
      cmake {
        // React Native's own STL: two in one process crash.
        arguments "-DANDROID_STL=c++_shared"
        cppFlags "-std=c++20", "-frtti", "-fexceptions"
      }
    }
    // The ABIs build-android.sh builds.
    ndk {
      abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version "3.22.1"
    }
  }

  sourceSets {
    main {
      jniLibs.srcDirs = ["src/main/jniLibs"]
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.facebook.fbjni:fbjni:0.7.0"
}
