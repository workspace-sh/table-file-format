# The web demo on GitHub Pages: https://workspace-sh.github.io/table-file-format/
# Built from apps/web and deployed on every push to develop.

name: Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one still queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the web demo for /table-file-format/
        run: npm run web:build
        env:
          PAGES_BASE: /table-file-format/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
