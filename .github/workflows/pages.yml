# The web demo on GitHub Pages: https://workspace-sh.github.io/table-file-format/
# Built from apps/web and deployed on every push to develop.

name: Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one still queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build's number counts the day's commits (docs/VERSIONING.md): it needs the history.
          fetch-depth: 0
      # The fixtures are the private workspace-fixtures repository, a submodule (fixtures/ links
      # into it). Read with its read-only deploy key, whose private half is this secret.
      - name: Fetch the fixtures
        env:
          FIXTURES_DEPLOY_KEY: ${{ secrets.FIXTURES_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$FIXTURES_DEPLOY_KEY" > ~/.ssh/fixtures
          chmod 600 ~/.ssh/fixtures
          git config submodule.workspace-fixtures.url git@github.com:workspace-sh/workspace-fixtures.git
          GIT_SSH_COMMAND="ssh -i ~/.ssh/fixtures -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git submodule update --init --depth 1
          rm ~/.ssh/fixtures
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # npm/cli#4828: a lockfile written on a Mac can leave out the Linux
      # build of Rollup that Vite needs. Add it at the version the
      # lockfile pins.
      - name: Add Rollup's Linux build
        run: npm install --no-save "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")"
      - name: Build the web demo for /table-file-format/
        run: npm run web:build
        env:
          PAGES_BASE: /table-file-format/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
